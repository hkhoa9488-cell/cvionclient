name: Build NewTimeSMP JAR

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract NewTimeSMP.zip (if present) & locate project root
        run: |
          if [ -f "NewTimeSMP.zip" ]; then
            echo "Found NewTimeSMP.zip, extracting..."
            unzip -o NewTimeSMP.zip
          fi

          if [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "NewTimeSMP-1.0.0-mc26.2/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=NewTimeSMP-1.0.0-mc26.2" >> "$GITHUB_ENV"
          else
            FOUND_DIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -printf "%h\n" | head -n 1)
            if [ -z "$FOUND_DIR" ]; then
              echo "Error: settings.gradle.kts not found!"
              exit 1
            fi
            echo "PROJECT_DIR=$FOUND_DIR" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 25 (for Paper 26.2)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up JDK 21 (default for Gradle 8.14.3 & modules)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build & test NewTimeSMP 1.0.0 modules
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          java -version
          if ls scripts/*.sh 1> /dev/null 2>&1; then
            sed -i 's/\r$//' scripts/*.sh
            chmod +x scripts/*.sh
            ./scripts/verify-patches.sh
          fi

          gradle build --no-daemon --stacktrace

          mkdir -p dist
          find newtimesmp-*/build/libs -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Build runnable NewTimeSMP Server JAR (~60MB)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          if [ -n "$JAVA_HOME_25_X64" ]; then
            export JAVA_HOME="$JAVA_HOME_25_X64"
          else
            JDK25_DIR=$(find /opt/hostedtoolcache -maxdepth 4 -type d -name "25.*" | head -n 1)
            if [ -n "$JDK25_DIR" ]; then
              export JAVA_HOME="$JDK25_DIR/x64"
            fi
          fi
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version

          git config --global user.name "NewTimeSMP CI"
          git config --global user.email "ci@newtimesmp.local"

          rm -rf .local-maven
          mkdir -p .local-maven
          DEPS_KTS=""
          for jar in dist/*.jar; do
            [ -f "$jar" ] || continue
            MOD_NAME=$(basename "$jar" .jar)
            MOD_DIR=".local-maven/com/newtimesmp/${MOD_NAME}/1.0.0"
            mkdir -p "$MOD_DIR"
            cp "$jar" "${MOD_DIR}/${MOD_NAME}-1.0.0.jar"
            printf '<project><modelVersion>4.0.0</modelVersion><groupId>com.newtimesmp</groupId><artifactId>%s</artifactId><version>1.0.0</version></project>\n' "$MOD_NAME" > "${MOD_DIR}/${MOD_NAME}-1.0.0.pom"
            DEPS_KTS="${DEPS_KTS}    implementation(\"com.newtimesmp:${MOD_NAME}:1.0.0\")\n"
          done

          UPSTREAM_URL="https://github.com/PaperMC/Paper.git"
          if git ls-remote --heads "$UPSTREAM_URL" "ver/26.2" | grep -q "ver/26.2"; then
            TARGET_BRANCH="ver/26.2"
          else
            TARGET_BRANCH="main"
          fi
          echo "Using Paper upstream branch: $TARGET_BRANCH"

          rm -rf .upstream-paper
          git clone --depth 1 --branch "$TARGET_BRANCH" "$UPSTREAM_URL" .upstream-paper

          cd .upstream-paper
          chmod +x gradlew

          printf '\norg.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+UseG1GC\norg.gradle.daemon=false\norg.gradle.parallel=false\norg.gradle.workers.max=2\n' >> gradle.properties

          echo "Step 1/3: Decompiling Minecraft & applying Paper patches..."
          if ! ./gradlew applyPatches --no-daemon --max-workers=2 --stacktrace 2>&1 | tee /tmp/paper-build.log; then
            echo "================ EXACT FAILURE REASON (applyPatches) ================"
            grep -B 15 -A 10 "FAILURE: Build failed with an exception." /tmp/paper-build.log || tail -n 80 /tmp/paper-build.log
            exit 1
          fi

          echo "Step 2/3: Injecting NewTimeSMP Bootstrap hook..."
          python3 -c '
          import glob, os, re, zipfile

          classes = []
          for jar_path in sorted(glob.glob("../dist/newtimesmp-*.jar")):
              with zipfile.ZipFile(jar_path, "r") as zf:
                  for name in zf.namelist():
                      if name.endswith(".class") and "$" not in name and not name.endswith("package-info.class") and not name.endswith("module-info.class"):
                          classes.append(name[:-6].replace("/", "."))

          os.makedirs("paper-server/src/main/java/com/newtimesmp/bootstrap", exist_ok=True)
          class_entries = ",\n        ".join(f"\"{c}\"" for c in classes)

          java_code = f"""package com.newtimesmp.bootstrap;

          import java.lang.reflect.Method;
          import java.lang.reflect.Modifier;
          import java.util.Set;
          import org.bukkit.Bukkit;

          @SuppressWarnings("deprecation")
          public final class NewTimeSMPBootstrap {{
              private static boolean initialized = false;
              private static final String[] MODULE_CLASSES = {{
                  {class_entries}
              }};
              private static final Set<String> ENTRY_METHODS = Set.of(
                  "bootstrap", "init", "initialize", "start", "enable", "register", "load"
              );

              public static synchronized void init() {{
                  if (initialized) return;
                  initialized = true;
                  Bukkit.getLogger().info("[NewTimeSMP] Bootstrapping NewTimeSMP 1.0.0 (MC 26.2) - scanning " + MODULE_CLASSES.length + " module classes...");
                  int loaded = 0;
                  int invoked = 0;
                  ClassLoader cl = NewTimeSMPBootstrap.class.getClassLoader();
                  for (String className : MODULE_CLASSES) {{
                      try {{
                          Class<?> clazz = Class.forName(className, true, cl);
                          loaded++;
                          for (Method m : clazz.getDeclaredMethods()) {{
                              if (Modifier.isStatic(m.getModifiers()) && Modifier.isPublic(m.getModifiers())
                                      && m.getParameterCount() == 0 && ENTRY_METHODS.contains(m.getName())) {{
                                  Bukkit.getLogger().info("[NewTimeSMP] Invoking " + className + "#" + m.getName() + "()");
                                  m.invoke(null);
                                  invoked++;
                              }}
                          }}
                      }} catch (Throwable t) {{
                          Bukkit.getLogger().warning("[NewTimeSMP] Skipped " + className + ": " + t);
                      }}
                  }}
                  Bukkit.getLogger().info("[NewTimeSMP] Initialization complete (loaded=" + loaded + ", entrypoints=" + invoked + ").");
              }}
          }}
          """

          with open("paper-server/src/main/java/com/newtimesmp/bootstrap/NewTimeSMPBootstrap.java", "w", encoding="utf-8") as f:
              f.write(java_code)

          craft_server = "paper-server/src/main/java/org/bukkit/craftbukkit/CraftServer.java"
          with open(craft_server, "r", encoding="utf-8") as f:
              src = f.read()

          src, name_count = re.subn(r"(public\s+String\s+getName\s*\(\s*\)\s*\{)", r"\1\n        if (true) return \"NewTimeSMP\";", src, count=1)
          src, hook_count = re.subn(r"(public\s+void\s+loadPlugins\s*\(\s*\)\s*\{)", r"\1\n        com.newtimesmp.bootstrap.NewTimeSMPBootstrap.init();", src, count=1)
          assert name_count == 1 and hook_count == 1, f"Hook failed: name={name_count}, hook={hook_count}"

          with open(craft_server, "w", encoding="utf-8") as f:
              f.write(src)

          print(f"Successfully generated NewTimeSMPBootstrap with {len(classes)} classes and hooked CraftServer.java")
          '

          echo "Injecting 7 NewTimeSMP modules via local Maven..."
          printf '\nrepositories {\n    maven { url = uri(file("${rootProject.projectDir}/../.local-maven")) }\n}\ndependencies {\n%b}\n' "$DEPS_KTS" >> paper-server/build.gradle.kts

          echo "Step 3/3: Building patched & bundled Paperclip Server JAR..."
          if ! ./gradlew createPaperclipJar --no-daemon --max-workers=2 --stacktrace 2>&1 | tee -a /tmp/paper-build.log; then
            echo "================ EXACT FAILURE REASON (createPaperclipJar) ================"
            grep -B 15 -A 10 "FAILURE: Build failed with an exception." /tmp/paper-build.log || tail -n 80 /tmp/paper-build.log
            exit 1
          fi
          cd ..

          SERVER_JAR=""
          for jar in $(find .upstream-paper -path "*/build/libs/*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar"); do
            MANIFEST=$(unzip -p "$jar" META-INF/MANIFEST.MF 2>/dev/null || true)
            if echo "$MANIFEST" | grep -qE "io\.papermc\.paperclip\.Main|Bundler-Format"; then
              SERVER_JAR="$jar"
              break
            fi
          done

          if [ -z "$SERVER_JAR" ]; then
            SERVER_JAR=$(find .upstream-paper -path "*/build/libs/*.jar" \( -name "*paperclip*.jar" -o -name "*bundler*.jar" \) ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          fi

          if [ -z "$SERVER_JAR" ]; then
            echo "Error: Failed to locate runnable Paperclip/Bundler server JAR!"
            find .upstream-paper -path "*/build/libs/*.jar"
            exit 1
          fi

          echo "=== Verifying embedded NewTimeSMP modules ==="
          EMBEDDED_COUNT=$(unzip -p "$SERVER_JAR" META-INF/libraries.list | grep -c "com/newtimesmp" || true)
          unzip -p "$SERVER_JAR" META-INF/libraries.list | grep "com/newtimesmp" || true
          if [ "$EMBEDDED_COUNT" -lt 7 ]; then
            echo "Error: Expected 7 embedded modules in libraries.list, found $EMBEDDED_COUNT!"
            exit 1
          fi

          cp "$SERVER_JAR" "dist/NewTimeSMP-1.0.0-mc26.2.jar"
          rm -rf .upstream-paper/work .upstream-paper/.gradle .local-maven build */build
          ls -lh dist/

      - name: Upload NewTimeSMP Server JAR (~60MB)
        uses: actions/upload-artifact@v4
        with:
          name: NewTimeSMP-1.0.0-mc26.2-server
          path: ${{ env.PROJECT_DIR }}/dist/NewTimeSMP-1.0.0-mc26.2.jar
          if-no-files-found: error

      - name: Upload all NewTimeSMP JARs (Server + 7 Modules)
        uses: actions/upload-artifact@v4
        with:
          name: NewTimeSMP-1.0.0-mc26.2-all-jars
          path: ${{ env.PROJECT_DIR }}/dist/*.jar
          if-no-files-found: error
          
