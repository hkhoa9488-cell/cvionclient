name: Build NewTimeSMP JAR

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract NewTimeSMP.zip (if present) & locate project root
        run: |
          if [ -f "NewTimeSMP.zip" ]; then
            echo "Found NewTimeSMP.zip, extracting..."
            unzip -o NewTimeSMP.zip
          fi

          if [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "NewTimeSMP-1.0.0-mc26.2/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=NewTimeSMP-1.0.0-mc26.2" >> "$GITHUB_ENV"
          else
            FOUND_DIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -printf "%h\n" | head -n 1)
            if [ -z "$FOUND_DIR" ]; then
              echo "Error: settings.gradle.kts not found!"
              exit 1
            fi
            echo "PROJECT_DIR=$FOUND_DIR" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 25 (for Paper 26.2)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up JDK 21 (default for Gradle 8.14.3 & modules)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build & test NewTimeSMP 1.0.0 modules
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          java -version
          if ls scripts/*.sh 1> /dev/null 2>&1; then
            sed -i 's/\r$//' scripts/*.sh
            chmod +x scripts/*.sh
            ./scripts/verify-patches.sh
          fi

          gradle build --no-daemon --stacktrace

          mkdir -p dist
          find newtimesmp-*/build/libs -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} dist/ \;

      - name: Build runnable NewTimeSMP Server JAR (~60MB)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          if [ -n "$JAVA_HOME_25_X64" ]; then
            export JAVA_HOME="$JAVA_HOME_25_X64"
          else
            JDK25_DIR=$(find /opt/hostedtoolcache -maxdepth 4 -type d -name "25.*" | head -n 1)
            if [ -n "$JDK25_DIR" ]; then
              export JAVA_HOME="$JDK25_DIR/x64"
            fi
          fi
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version

          git config --global user.name "NewTimeSMP CI"
          git config --global user.email "ci@newtimesmp.local"

          UPSTREAM_URL="https://github.com/PaperMC/Paper.git"
          if git ls-remote --heads "$UPSTREAM_URL" "ver/26.2" | grep -q "ver/26.2"; then
            TARGET_BRANCH="ver/26.2"
          else
            TARGET_BRANCH="main"
          fi
          echo "Using Paper upstream branch: $TARGET_BRANCH"

          rm -rf .upstream-paper
          git clone --depth 1 --branch "$TARGET_BRANCH" "$UPSTREAM_URL" .upstream-paper

          cd .upstream-paper
          chmod +x gradlew

          # Cấp 4GB RAM cho quá trình giải mã Minecraft (Vineflower) và biên dịch paper-server
          cat << 'EOF' >> gradle.properties

          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+UseG1GC
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          EOF

          echo "Applying Paper patches & building Paperclip JAR..."
          if ! ./gradlew applyAllPatches createPaperclipJar --no-daemon --max-workers=2 --stacktrace 2>&1 | tee /tmp/paper-build.log; then
            echo "================ EXACT FAILURE REASON ================"
            grep -B 15 -A 10 "FAILURE: Build failed with an exception." /tmp/paper-build.log || tail -n 80 /tmp/paper-build.log
            exit 1
          fi
          cd ..

          SERVER_JAR=""
          for jar in $(find .upstream-paper -path "*/build/libs/*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar"); do
            MANIFEST=$(unzip -p "$jar" META-INF/MANIFEST.MF 2>/dev/null || true)
            if echo "$MANIFEST" | grep -qE "io\.papermc\.paperclip\.Main|Bundler-Format"; then
              SERVER_JAR="$jar"
              break
            fi
          done

          if [ -z "$SERVER_JAR" ]; then
            SERVER_JAR=$(find .upstream-paper -path "*/build/libs/*.jar" \( -name "*paperclip*.jar" -o -name "*bundler*.jar" \) ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          fi

          if [ -z "$SERVER_JAR" ]; then
            echo "Error: Failed to locate runnable Paperclip/Bundler server JAR!"
            find .upstream-paper -path "*/build/libs/*.jar"
            exit 1
          fi

          echo "Selected runnable JAR: $SERVER_JAR"
          MANIFEST_CONTENT=$(unzip -p "$SERVER_JAR" META-INF/MANIFEST.MF)
          echo "$MANIFEST_CONTENT" | grep -E "Main-Class|Bundler-Format"

          if echo "$MANIFEST_CONTENT" | grep -q "org.bukkit.craftbukkit.Main"; then
            echo "Error: Selected JAR is unbundled craftbukkit JAR and cannot run standalone!"
            exit 1
          fi

          JAR_SIZE=$(stat -c%s "$SERVER_JAR")
          if [ "$JAR_SIZE" -lt 35000000 ]; then
            echo "Error: Server JAR is too small ($JAR_SIZE bytes), expected greater than 35MB Paperclip/Bundler JAR!"
            exit 1
          fi

          cp "$SERVER_JAR" "dist/NewTimeSMP-1.0.0-mc26.2.jar"
          rm -rf .upstream-paper/work .upstream-paper/.gradle build */build
          ls -lh dist/

      - name: Upload NewTimeSMP Server JAR (~60MB)
        uses: actions/upload-artifact@v4
        with:
          name: NewTimeSMP-1.0.0-mc26.2-server
          path: ${{ env.PROJECT_DIR }}/dist/NewTimeSMP-1.0.0-mc26.2.jar
          if-no-files-found: error

      - name: Upload all NewTimeSMP JARs (Server + 7 Modules)
        uses: actions/upload-artifact@v4
        with:
          name: NewTimeSMP-1.0.0-mc26.2-all-jars
          path: ${{ env.PROJECT_DIR }}/dist/*.jar
          if-no-files-found: error
          
