name: Build NewTimeSMP JAR

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_full_server:
        description: "Clone Paper 26.2 upstream & build full Paperclip server JAR (slower)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract NewTimeSMP zip (if present) & locate project root
        run: |
          for archive in NewTimeSMP-1.0.0-mc26.2-slim.zip NewTimeSMP-1.0.0-mc26.2.zip project.zip; do
            if [ -f "$archive" ]; then
              echo "Found $archive, extracting..."
              unzip -o "$archive"
              break
            fi
          done

          if [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "NewTimeSMP-1.0.0-mc26.2/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=NewTimeSMP-1.0.0-mc26.2" >> "$GITHUB_ENV"
          else
            FOUND_DIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -printf "%h\n" | head -n 1)
            if [ -z "$FOUND_DIR" ]; then
              echo "Error: settings.gradle.kts not found!"
              exit 1
            fi
            echo "PROJECT_DIR=$FOUND_DIR" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Verify patch structure & run Gradle build + tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/verify-patches.sh
          gradle build --no-daemon

      - name: Collect NewTimeSMP 1.0.0 JAR artifacts
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p dist
          find newtimesmp-*/build/libs -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Build full Paper 26.2 server JAR (optional via workflow_dispatch)
        if: ${{ github.event.inputs.build_full_server == 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./scripts/build-slim.sh

      - name: Upload NewTimeSMP 1.0.0 JARs
        uses: actions/upload-artifact@v4
        with:
          name: NewTimeSMP-1.0.0-mc26.2-jar
          path: ${{ env.PROJECT_DIR }}/dist/*.jar
          if-no-files-found: error
          
