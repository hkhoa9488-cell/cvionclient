      - name: Build runnable NewTimeSMP Server JAR (~60MB)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          if [ -n "$JAVA_HOME_25_X64" ]; then
            export JAVA_HOME="$JAVA_HOME_25_X64"
          else
            JDK25_DIR=$(find /opt/hostedtoolcache -maxdepth 4 -type d -name "25.*" | head -n 1)
            if [ -n "$JDK25_DIR" ]; then
              export JAVA_HOME="$JDK25_DIR/x64"
            fi
          fi
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version

          git config --global user.name "NewTimeSMP CI"
          git config --global user.email "ci@newtimesmp.local"

          # 1. Tạo kho Maven cục bộ chứa 7 module từ thư mục dist/ để Paperweight nhận diện hợp lệ
          rm -rf .local-maven
          MODULE_DEPS=""
          for jar in dist/*.jar; do
            [ -f "$jar" ] || continue
            MOD_NAME=$(basename "$jar" .jar)
            MOD_DIR=".local-maven/com/newtimesmp/${MOD_NAME}/1.0.0"
            mkdir -p "$MOD_DIR"
            cp "$jar" "${MOD_DIR}/${MOD_NAME}-1.0.0.jar"
            cat << POMEOF > "${MOD_DIR}/${MOD_NAME}-1.0.0.pom"
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.newtimesmp</groupId>
            <artifactId>${MOD_NAME}</artifactId>
            <version>1.0.0</version>
          </project>
          POMEOF
            MODULE_DEPS="${MODULE_DEPS}    runtimeOnly(\"com.newtimesmp:${MOD_NAME}:1.0.0\")\n"
          done

          UPSTREAM_URL="https://github.com/PaperMC/Paper.git"
          if git ls-remote --heads "$UPSTREAM_URL" "ver/26.2" | grep -q "ver/26.2"; then
            TARGET_BRANCH="ver/26.2"
          else
            TARGET_BRANCH="main"
          fi
          echo "Using Paper upstream branch: $TARGET_BRANCH"

          rm -rf .upstream-paper
          git clone --depth 1 --branch "$TARGET_BRANCH" "$UPSTREAM_URL" .upstream-paper

          cd .upstream-paper
          chmod +x gradlew

          cat << 'EOF' >> gradle.properties

          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+UseG1GC
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          EOF

          echo "Step 1/2: Decompiling Minecraft & applying Paper patches..."
          if ! ./gradlew applyPatches --no-daemon --max-workers=2 --stacktrace 2>&1 | tee /tmp/paper-build.log; then
            echo "================ EXACT FAILURE REASON (applyPatches) ================"
            grep -B 15 -A 10 "FAILURE: Build failed with an exception." /tmp/paper-build.log || tail -n 80 /tmp/paper-build.log
            exit 1
          fi

          # 2. Nhúng 7 module vào runtimeClasspath của paper-server trước khi đóng gói Paperclip
          if [ -n "$MODULE_DEPS" ]; then
            echo "Injecting NewTimeSMP modules into paper-server..."
            {
              echo ""
              echo "repositories {"
              echo "    maven { url = uri(rootProject.projectDir.resolve(\"../.local-maven\")) }"
              echo "}"
              echo "dependencies {"
              printf "%b" "$MODULE_DEPS"
              echo "}"
            } >> paper-server/build.gradle.kts
          fi

          echo "Step 2/2: Building bundled Paperclip Server JAR..."
          if ! ./gradlew createPaperclipJar --no-daemon --max-workers=2 --stacktrace 2>&1 | tee -a /tmp/paper-build.log; then
            echo "================ EXACT FAILURE REASON (createPaperclipJar) ================"
            grep -B 15 -A 10 "FAILURE: Build failed with an exception." /tmp/paper-build.log || tail -n 80 /tmp/paper-build.log
            exit 1
          fi
          cd ..

          SERVER_JAR=""
          for jar in $(find .upstream-paper -path "*/build/libs/*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar"); do
            MANIFEST=$(unzip -p "$jar" META-INF/MANIFEST.MF 2>/dev/null || true)
            if echo "$MANIFEST" | grep -qE "io\.papermc\.paperclip\.Main|Bundler-Format"; then
              SERVER_JAR="$jar"
              break
            fi
          done

          if [ -z "$SERVER_JAR" ]; then
            SERVER_JAR=$(find .upstream-paper -path "*/build/libs/*.jar" \( -name "*paperclip*.jar" -o -name "*bundler*.jar" \) ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          fi

          if [ -z "$SERVER_JAR" ]; then
            echo "Error: Failed to locate runnable Paperclip/Bundler server JAR!"
            find .upstream-paper -path "*/build/libs/*.jar"
            exit 1
          fi

          echo "Selected runnable JAR: $SERVER_JAR"
          # 3. Kiểm tra xác nhận 7 module đã nằm bên trong META-INF/libraries.list
          echo "=== Embedded NewTimeSMP modules check ==="
          unzip -p "$SERVER_JAR" META-INF/libraries.list | grep "com/newtimesmp" || true

          JAR_SIZE=$(stat -c%s "$SERVER_JAR")
          if [ "$JAR_SIZE" -lt 35000000 ]; then
            echo "Error: Server JAR is too small ($JAR_SIZE bytes)!"
            exit 1
          fi

          cp "$SERVER_JAR" "dist/NewTimeSMP-1.0.0-mc26.2.jar"
          rm -rf .upstream-paper/work .upstream-paper/.gradle .local-maven build */build
          ls -lh dist/
          
